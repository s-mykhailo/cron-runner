name: scheduled-task

on:
  schedule:
    # Резервний "самозцілювач", НЕ основний механізм — перевірено наживо: замість
    # кожні 5 хв GitHub давав розриви по 1.5-4.5 год (навіть зі зсувом хвилини від
    # круглих позначок). schedule-триґер на такому короткому інтервалі просто
    # ненадійний. Основний темп тримає self-chaining через workflow_dispatch
    # (останній крок нижче) — API-виклик обходить той самий занедбаний scheduler.
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-task
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout private workload repo
        uses: actions/checkout@v4
        with:
          repository: s-mykhailo/gift-market-tracker
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Run one cycle
        working-directory: app
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTIFY_CHAT_IDS: ${{ secrets.NOTIFY_CHAT_IDS }}
          PRICE_THRESHOLD_USD: ${{ secrets.PRICE_THRESHOLD_USD }}
          ENABLE_TONNEL: ${{ secrets.ENABLE_TONNEL }}
          ENABLE_FRAGMENT: ${{ secrets.ENABLE_FRAGMENT }}
          ENABLE_PORTALS: ${{ secrets.ENABLE_PORTALS }}
          FRAGMENT_COLLECTIONS: ${{ secrets.FRAGMENT_COLLECTIONS }}
          TONNEL_AUTH_DATA: ${{ secrets.TONNEL_AUTH_DATA }}
          PORTALS_AUTH_DATA: ${{ secrets.PORTALS_AUTH_DATA }}
        run: python scripts/ci_run.py

      # actions/checkout лишає в app/.git закодований у PRIVATE_REPO_PAT credential
      # (persist-credentials: true за замовчуванням) — тому git push тут працює без
      # повторного вбудовування токена в URL вручну.
      - name: Persist tracker state back to the private repo
        working-directory: app
        run: |
          git config user.name "gift-market-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update tracker state [skip ci]"
          git push

      # if: always() — навіть якщо попередній крок впав (мережевий збій в циклі
      # опитування, конфлікт при push тощо), ланцюжок самозапуску не повинен
      # обірватись. Без цього одна невдача назавжди зупинила б увесь цикл.
      - name: Wait out the rest of the ~5-minute cycle, then trigger the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))
          remaining=$(( 300 - elapsed ))
          if [ "$remaining" -gt 0 ]; then
            sleep "$remaining"
          fi
          gh workflow run poll.yml -R s-mykhailo/cron-runner --ref main
